services:
  signal:
    build:
      context: .
      dockerfile: Dockerfile
    image: signal-cli:latest
    # signal-cli only bundles libsignal native libs for x86_64 Linux.
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - "${SIGNAL_STATE_DIR:-./state}:/var/lib/signal-cli"
    networks:
      - pai-transports
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec signal-cli --config=/var/lib/signal-cli -a "$${SIGNAL_PHONE_NUMBER}" daemon --http 0.0.0.0:8080'

networks:
  pai-transports:
    name: "${PAI_TRANSPORTS_NETWORK:-pai-transports}"
    external: true
