services:
  signal-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: signal-cli:latest
    # signal-cli only bundles libsignal native libs for x86_64 Linux.
    # This must stay linux/amd64 regardless of host architecture.
    platform: linux/amd64
    container_name: signal-cli
    restart: unless-stopped
    ports:
      # Host interface to bind to.
      # - "127.0.0.1:8088:8080"  → localhost only (safe default)
      # - "0.0.0.0:8088:8080"     → reachable from LAN
      # Do NOT expose this port to the public internet — there is no authentication.
      - "${SIGNAL_BIND_HOST}:8088:8080"
    volumes:
      # Named volume keeps your account data, keys, and attachments safe across restarts.
      - signal-cli-data:/var/lib/signal-cli
    # Run as the standalone HTTP daemon on all container interfaces.
    command: ["-a", "${SIGNAL_PHONE_NUMBER}", "daemon", "--http", "0.0.0.0:8080"]

volumes:
  signal-cli-data:
    name: signal-cli-data
